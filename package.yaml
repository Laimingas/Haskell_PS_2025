name:                fp2025
version:             0.1.0.0
github:              "vipo/fp-2025"
license:             BSD-3-Clause
author:              "Author name here"
maintainer:          "example@example.com"
copyright:           "2024 Author name here"

extra-source-files:
  - README.md
  - CHANGELOG.md

description:         Please see the README on GitHub at <https://github.com/githubuser/fp2024#readme>

dependencies:
  - base >= 4.7 && < 5 
  - scotty >= 0.20.1

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: src
  dependencies:
    - random
    - stm
    - async
    - directory
    - deepseq
    - free
    - QuickCheck
    - strict
    - transformers
    - mtl      
    - http-types
    - http-conduit
    - bytestring
    - aeson
    - text

executables:
  fp2025-one:
    main: Main.hs
    source-dirs: app1
    ghc-options:
      - -rtsopts
    dependencies:
      - fp2025
      - repline
      - http-conduit
      - http-client
      - http-types
      - bytestring
      - aeson
      - text
  fp2025-two:
    main: Main.hs
    source-dirs: app2
    ghc-options:
      - -rtsopts
    dependencies:
      - fp2025
      - repline
      - http-conduit
      - http-client
      - http-types
      - bytestring
      - aeson
      - text
  fp2025-three:
    main: Main.hs
    source-dirs: app3
    ghc-options:
      - -rtsopts
    dependencies:
      - fp2025
      - repline
      - stm
      - async
      - directory
      - http-conduit
      - http-client
      - http-types
      - bytestring
      - aeson
      - text
  fp2025-server:
    main: Main.hs
    source-dirs: server
    ghc-options:
      - -rtsopts
    dependencies:
      - fp2025
      - base
      - scotty
      - stm
      - directory
      - async
      - transformers
      - mtl
      - unix        
      - text 
      - http-types
      - http-conduit    
      - bytestring 
  fp2025-client:
    main: Main.hs
    source-dirs: client
    ghc-options:
      - -rtsopts
    dependencies:
      - fp2025
      - base
      - http-client
      - transformers
      - http-conduit      
      - bytestring
      - free
      - mtl
      - text       
      - stm         
      - unix 
      - http-types


tests:
  fp2024-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - fp2025
      - tasty
      - tasty-hunit
      - tasty-quickcheck
      - transformers